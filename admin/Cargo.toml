[package]
name = "baradir-admin"
version = "0.1.0"
edition = "2024"

[dependencies]
topcoat = { version = "0.10", features = ["tailwind", "ui"] }
http = "1"
bytes = "1.12.1"
http-body-util = "0.1.5"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
topcoat = { version = "0.10", default-features = false, features = ["tailwind"] }
